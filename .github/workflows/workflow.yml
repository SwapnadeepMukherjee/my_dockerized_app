name: Docker Build and Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container:
      image: python:3.11
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: 3.11
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r python-image/requirements.txt
        pip install flake8 pytest pytest-cov httpx pip-audit bandit
    - name: Lint Python (flake8)
      run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Run tests with coverage
      run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80
    - name: Security scan (dependencies)
      run: pip-audit -r python-image/requirements.txt
    - name: Security scan (static analysis)
      run: bandit -r python-image/app.py
